run_optimization:
  name: Run Optimization
  description: Run EV charging optimization with provided parameters
  fields:
    batteries:
      name: Batteries
      description: Array of battery configurations
      required: true
      example: '[{"s_min": 5000, "s_max": 50000, "s_initial": 15000, "c_min": 0, "c_max": 11000, "d_max": 5000, "p_a": 0.25}]'
    time_series:
      name: Time Series
      description: Time series data for optimization
      required: true
      example: '{"dt": [3600, 3600], "gt": [3000, 4000], "ft": [2000, 6000], "p_N": [0.30, 0.25], "p_E": [0.15, 0.12]}'
    strategy:
      name: Strategy
      description: Optimization strategy preferences
      required: false
      example: '{"charging_strategy": "charge_before_export", "discharging_strategy": "discharge_before_import"}'
    grid:
      name: Grid
      description: Grid configuration limits
      required: false
      example: '{"p_max_imp": 10000, "p_max_exp": 5000, "prc_p_imp_exc": 0.50}'
    eta_c:
      name: Charging Efficiency
      description: Charging efficiency (0-1)
      required: false
      example: 0.95
      default: 0.95
    eta_d:
      name: Discharging Efficiency
      description: Discharging efficiency (0-1)
      required: false
      example: 0.95
      default: 0.95